<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Website</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        /* Header */
        header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        /* Navigation */
        nav {
            background: #172554;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Main Section */
        .main {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .form-container h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .gender {
            display: flex;
            gap: 25px;
            margin-top: 10px;
        }

        .gender label {
            font-weight: normal;
            margin: 0;
        }

        .gender input {
            width: auto;
            margin-right: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            color: green;
            font-weight: bold;
        }

        footer {
            background: #172554;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>ABC College</h1>
        <p>Student Registration Portal</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#registration">Registration</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Main Content -->
    <main class="main">

        <div class="form-container" id="registration">

            <h2>Student Registration Form</h2>

            <form id="studentForm">

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >

                <label for="dob">Date of Birth</label>
                <input
                    type="date"
                    id="dob"
                    required
                >

                <label>Gender</label>

                <div class="gender">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                            required
                        >
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other"
                        >
                        Other
                    </label>

                </div>

                <label for="course">Select Course</label>

                <select id="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="BCA">BCA</option>
                    <option value="BBA">BBA</option>
                    <option value="BSc">BSc</option>
                    <option value="BCom">BCom</option>
                    <option value="BA">BA</option>
                </select>

                <label for="address">Address</label>

                <textarea
                    id="address"
                    rows="4"
                    placeholder="Enter your address"
                    required
                ></textarea>

                <label for="password">Create Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

                <button type="submit">
                    Register Student
                </button>

                <p id="message"></p>

            </form>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 ABC College | Student Registration Portal</p>
    </footer>

    <!-- JavaScript -->
    <script>

        const form = document.getElementById("studentForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const studentName =
                document.getElementById("name").value;

            message.innerHTML =
                "Registration Successful! Welcome " +
                studentName + "!";

            form.reset();

        });

    </script>

</body>
</html>
